manifest_version: 2
name: hermes-phone
version: "0.2.0-phase1"
description: "Approved outbound phone calls with pluggable adapters (Deepgram, xAI, ElevenLabs), AI disclosure, spend caps, and Bahrain PDPL compliance."
author: clippahq (fork of winchxyz)
kind: standalone
license: MIT
homepage: https://github.com/clippahq/hermes-phone
tags: [voice, phone, twilio, deepgram, elevenlabs, xai, restaurant, booking]
provides_tools: [phone_prepare, phone_call, phone_status, phone_transcript]
provides_hooks: [pre_tool_call, pre_llm_call, transform_llm_output]
python_dependencies:
  - "twilio>=9,<10"
  - "fastapi>=0.110,<1"
  - "uvicorn[standard]>=0.29,<1"
  - "websockets>=14,<16"
  - "phonenumbers>=8.13,<10"
  - "tzdata>=2024.1,<2027"
  - "httpx>=0.27,<1"
  - "jiwer>=3.0,<4"  # For STT bake-off CER/WER computation
requires_env:
  - name: TWILIO_ACCOUNT_SID
    description: "Twilio account SID"
    url: "https://console.twilio.com"
    secret: true
  - name: TWILIO_AUTH_TOKEN
    description: "Twilio auth token"
    url: "https://console.twilio.com"
    secret: true
  - name: TWILIO_FROM_NUMBER
    description: "Your Twilio number in E.164"
  - name: OPENAI_API_KEY
    description: "OpenAI key for Realtime"
    url: "https://platform.openai.com/api-keys"
    secret: true
  - name: PUBLIC_BASE_URL
    description: "Public https URL of your ngrok/cloudflared tunnel to the bridge"
# Developer-only env (deliberately not in requires_env; never set by the model):
#   HERMES_PHONE_TEST_ALLOWLIST  comma-separated E.164 numbers that may be dialed.
#                                Unset or empty means ALL dialing is refused.
#   HERMES_PHONE_ALLOW_ALL=1     explicit developer opt-out of the allowlist.
config_schema:
  user_name:
    type: string
    description: "Name the agent says it calls on behalf of"
  callback_number:
    type: string
    description: "Callback number the agent may give, E.164"
  question_timeout_s:
    type: integer
    default: 75
    description: "Seconds to wait for the user to answer a mid-call question (30 to 120)"
  model:
    type: string
    default: "gpt-realtime-2.1"
    description: "OpenAI Realtime model id for the voice session"
  voice:
    type: string
    default: "marin"
    description: "Realtime voice name"
  max_duration_s:
    type: integer
    default: 300
    description: "Default max call duration in seconds (hard cap 900)"
  daily_call_limit:
    type: integer
    default: 10
    description: "Maximum calls placed per rolling 24 hours"
  store_transcripts:
    type: boolean
    default: true
    description: "Keep call transcripts in plugin storage"
  twilio_cost_per_min_usd:
    type: number
    default: 0.014
    description: "Twilio outbound price per started minute, used only for the cost estimate in the result message"
  realtime_cost_per_min_usd:
    type: number
    default: 0.15
    description: "Assumed OpenAI Realtime audio cost per minute for the estimate (an estimate, not a bill)"
  # Phase 1: Pluggable adapter configuration
  stt_adapter:
    type: string
    default: "deepgram"
    description: "STT adapter: 'deepgram' or 'openai_realtime'"
  stt_language:
    type: string
    default: "multi"
    description: "Deepgram language: 'ar-SA', 'ar-AE', 'ar', or 'multi'"
  llm_adapter:
    type: string
    default: "xai"
    description: "LLM adapter: 'xai' or 'openai'"
  llm_model:
    type: string
    default: "grok-4.3"
    description: "LLM model name (e.g., 'grok-4.3', 'grok-4.7')"
  llm_reasoning_effort:
    type: string
    default: "none"
    description: "xAI reasoning effort: 'none', 'low', 'medium', 'high', 'xhigh'"
  tts_adapter:
    type: string
    default: "elevenlabs"
    description: "TTS adapter: 'elevenlabs' or 'openai_realtime'"
  # Phase 1: Daily spend caps (Bahrain timezone)
  max_daily_spend_usd:
    type: number
    default: 6.0
    description: "Maximum spend per Bahrain day in USD"
  max_daily_minutes:
    type: number
    default: 20.0
    description: "Maximum minutes per Bahrain day"
  max_daily_calls:
    type: integer
    default: 10
    description: "Maximum calls per Bahrain day"
  # Phase 1: Voicemail and retry policy
  voicemail_mode:
    type: string
    default: "leave_callback"
    description: "Voicemail mode: 'leave_callback' or 'hangup_silent'"
  max_retries:
    type: integer
    default: 2
    description: "Max retries on no_answer/busy/voicemail"
